# QA schedule for this repo's Playwright suite.
#   Every push to main and every pull request: type check + smoke tests (desktop).
#   Daily at 07:06: smoke tests (desktop).
#   Weekly on Sunday at 06:57: full suite (desktop).
#   Monthly: full suite on mobile (day 8, 06:30) and tablet (day 22, 06:37).
# Times are UTC and staggered per repo so the sites under test get little traffic at once.
# Run any suite on demand from the Actions tab (Run workflow).
name: QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '6 7 * * *'   # smoke
    - cron: '57 6 * * 0'   # full-desktop
    - cron: '30 6 8 * *'   # full-mobile
    - cron: '37 6 22 * *'   # full-tablet
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options: [smoke, full-desktop, full-mobile, full-tablet]
        default: smoke

concurrency:
  group: qa-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Choose suite
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          case "$EVENT" in
            schedule)
              case "$CRON" in
                "6 7 * * *") suite=smoke ;;
                "57 6 * * 0") suite=full-desktop ;;
                "30 6 8 * *") suite=full-mobile ;;
                "37 6 22 * *") suite=full-tablet ;;
                *) suite=smoke ;;
              esac ;;
            workflow_dispatch) suite="${INPUT_SUITE:-smoke}" ;;
            *) suite=smoke ;;
          esac
          case "$suite" in
            smoke)        args='--project=chromium-desktop --grep @smoke --grep-invert "served over HTTPS"'; browsers=chromium ;;
            full-desktop) args='--project=chromium-desktop'; browsers=chromium ;;
            full-mobile)  args='--project=mobile-chrome'; browsers=chromium ;;
            full-tablet)  args='--project=tablet'; browsers='chromium webkit' ;;
          esac
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"
          echo "Running suite: $suite"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Type check
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npx tsc --noEmit

      - name: Install browsers
        run: npx playwright install --with-deps ${{ steps.plan.outputs.browsers }}

      - name: Run ${{ steps.plan.outputs.suite }} tests
        run: npx playwright test --workers=1 ${{ steps.plan.outputs.args }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ steps.plan.outputs.suite }}
          path: playwright-report/
          retention-days: 14
